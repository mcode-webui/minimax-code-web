# Development and testing environment for the Web UI.
#
#   docker compose up webui                  # run the branch's built Web UI
#   → http://localhost:8080/?token=dev-token
#
#   docker compose run --rm -p 8080:8080 dev # interactive dev shell over the
#                                            # mounted source; then inside:
#                                            #   pnpm install && pnpm build
#                                            #   node dist/cli.js webui --host 0.0.0.0 --no-open
#
# Both services reuse the host's MiniMax Code credentials (~/.minimax) and the
# webui's own state (~/.mcode-webui) via bind mounts, and run as the host user
# (uid/gid 1000 by default — override with WEBUI_UID/WEBUI_GID) so files the
# container writes keep your ownership.
#
# The token is fixed for dev convenience (WEBUI_TOKEN). The host browser is a
# non-local client from the container's point of view, so every URL needs
# ?token=… or an Authorization header; unset WEBUI_TOKEN to use the generated
# token flow instead (read it from the mounted ~/.mcode-webui/settings.json).

services:
  webui:
    build: .
    image: mcode-webui:dev
    init: true
    user: "${WEBUI_UID:-1000}:${WEBUI_GID:-1000}"
    environment:
      HOME: /home/node
      TOKEN: ${WEBUI_TOKEN:-dev-token}
      PORT: ${WEBUI_PORT:-8080}
    ports:
      - "${WEBUI_PORT:-8080}:${WEBUI_PORT:-8080}"
    volumes:
      - ${HOME}/.minimax:/home/node/.minimax
      - ${HOME}/.mcode-webui:/home/node/.mcode-webui
    restart: unless-stopped

  dev:
    image: mcode-webui:dev
    init: true
    user: "${WEBUI_UID:-1000}:${WEBUI_GID:-1000}"
    working_dir: /repo
    environment:
      HOME: /home/node
      # Keep package-manager state inside the container, off the bind mounts.
      XDG_DATA_HOME: /tmp/xdg
      PNPM_HOME: /tmp/pnpm
    command: sleep infinity
    volumes:
      - .:/repo
      - ${HOME}/.minimax:/home/node/.minimax
      - ${HOME}/.mcode-webui:/home/node/.mcode-webui
    profiles: ["dev"]
