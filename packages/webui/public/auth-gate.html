<!DOCTYPE html>
<!-- auth-gate.html — self-contained token gate (v2.3).
     Served for GET / or /index.html when the request is non-local and the
     token is missing/invalid (the app shell would otherwise load and fail
     every API call with bare 401s). No external assets — it must work before
     any /api/* access is possible. Verifies the token against /api/health,
     stores it under the same key state.js uses, and enters the app. -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MiniMax Code Web UI — Access token</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f5f4f0; color: #1c1c1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #141412; color: #e8e6e1; }
    .card { background: #1e1e1b; border-color: #333330; }
    input { background: #141412; border-color: #3c3c38; color: #e8e6e1; }
    .hint { color: #9a978f; }
  }
  .card {
    width: min(420px, calc(100vw - 32px)); padding: 32px 28px;
    background: #fff; border: 1px solid #e2dfd8; border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
  }
  .logo { font-size: 28px; text-align: center; }
  h1 { font-size: 17px; font-weight: 600; text-align: center; margin: 12px 0 4px; }
  .hint { font-size: 13px; text-align: center; color: #6b6862; margin: 0 0 20px; line-height: 1.6; }
  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 10px 12px; font-size: 14px; font-family: ui-monospace, monospace;
    border: 1px solid #d8d5cc; border-radius: 8px; outline: none;
  }
  input:focus { border-color: #4f46e5; }
  button {
    padding: 10px 18px; font-size: 14px; font-weight: 500; border: none; border-radius: 8px;
    background: #1c1c1a; color: #f5f4f0; cursor: pointer; white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) { button { background: #e8e6e1; color: #1c1c1a; } }
  button:disabled { opacity: .5; cursor: default; }
  .err { display: none; margin-top: 10px; font-size: 13px; color: #b91c1c; }
  .err.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🌐</div>
  <h1 data-i18n-t>MiniMax Code Web UI 需要访问令牌</h1>
  <p class="hint" data-i18n-h>此部署启用了令牌鉴权。请输入访问令牌；如不知道，请联系部署者（容器默认见 WEBUI_TOKEN）。<br>This deployment requires an access token. Ask the operator if you don't have one.</p>
  <label for="tok" data-i18n-l>访问令牌 / Access token</label>
  <div class="row">
    <input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="token…">
    <button id="go" data-i18n-b>进入</button>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
(function () {
  var en = /^(en|zh)/i.test(navigator.language || '') && !/^zh/i.test(navigator.language || '');
  var $ = function (id) { return document.getElementById(id); };
  if (en) {
    $('[data-i18n-t]').textContent = 'MiniMax Code Web UI — access token required';
    $('tok').placeholder = 'paste the access token…';
    $('go').textContent = 'Continue';
  }
  async function verify(token) {
    var resp = await fetch('/api/health?token=' + encodeURIComponent(token), { cache: 'no-store' });
    return resp.ok;
  }
  async function submit() {
    var t = $('tok').value.trim();
    var err = $('err');
    err.classList.remove('show');
    if (!t) {
      err.textContent = en ? 'Token is empty.' : '令牌不能为空。';
      err.classList.add('show');
      return;
    }
    $('go').disabled = true;
    try {
      if (await verify(t)) {
        try { localStorage.setItem('webui_token', t); } catch (e) {}
        location.replace('/?token=' + encodeURIComponent(t));
      } else {
        err.textContent = en ? 'Invalid token.' : '令牌无效。';
        err.classList.add('show');
      }
    } catch (e) {
      err.textContent = (en ? 'Verification failed: ' : '验证失败：') + e.message;
      err.classList.add('show');
    } finally {
      $('go').disabled = false;
    }
  }
  $('go').addEventListener('click', submit);
  $('tok').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  $('tok').focus();
})();
</script>
</body>
</html>
